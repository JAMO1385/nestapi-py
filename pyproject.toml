[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nestapi"
version = "1.0.0"
description = "Dynamic sync and async Python client for the NestAPI web services"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hossein Saberi", email = "devh3n@duck.com" }]
keywords = ["nestapi", "api", "client", "httpx", "async"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://nestapi.ir"

[tool.hatch.build.targets.wheel]
packages = ["src/nestapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
